name: Claude Review

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  initial-review:
    if: >-
      ${{
        github.event_name == 'pull_request' &&
        !github.event.pull_request.draft &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_GITHUB_ACTIONS }}
          github_token: ${{ github.token }}
          model: "claude-opus-4-8"
          direct_prompt: |
            Review this pull request. Focus on:
            - Correctness of SDK logic, request signing, and auth flows
            - Test coverage for changed behavior
            - Security implications, especially in wallet, keystore, signing, and session code
            - Adherence to code style (ktlint, KDoc on public APIs)
            - Any changes to the public API surface that should be reflected in docs/api.md or README.md
            Be concise. Flag blockers clearly; call out nits as nits.

  requested-review:
    if: >-
      (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request != null) &&
      contains(github.event.comment.body, '@claude review')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_GITHUB_ACTIONS }}
          github_token: ${{ github.token }}
          model: "claude-opus-4-8"
          trigger_phrase: "@claude review"
