name: Android CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Kotlin style check
        run: ./gradlew ktlintCheck

      - name: Run Android CI checks
        run: ./gradlew --build-cache :oms-client-kotlin-sdk:testDebugUnitTest :oms-client-kotlin-sdk:lintDebug :app:lintDebug :app:assembleDebug

      - name: Publish SDK unit test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: oms-client-kotlin-sdk/build/test-results/testDebugUnitTest/TEST-*.xml
          detailed_summary: true
          fail_on_failure: true
