name: Android CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Verify
        run: ./gradlew --build-cache verify

      - name: Publish SDK unit test report
        if: always()
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: oms-wallet-kotlin-sdk/build/test-results/testDebugUnitTest/TEST-*.xml
          detailed_summary: true
          fail_on_failure: true
