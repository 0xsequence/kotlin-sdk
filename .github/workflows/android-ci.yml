name: Android CI

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android CI checks
        run: ./gradlew --build-cache :oms-wallet-kotlin-sdk:testDebugUnitTest :app:assembleDebug

      - name: Publish SDK unit test report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: oms-wallet-kotlin-sdk/build/test-results/testDebugUnitTest/TEST-*.xml
          detailed_summary: true
          fail_on_failure: true

      - name: Upload SDK test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oms-wallet-kotlin-sdk-test-report
          path: |
            oms-wallet-kotlin-sdk/build/test-results/testDebugUnitTest
            oms-wallet-kotlin-sdk/build/reports/tests/testDebugUnitTest
          if-no-files-found: warn
