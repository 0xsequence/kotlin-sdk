name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY_GITHUB_ACTIONS }}
          direct_prompt: |
            Review this pull request. Focus on:
            - Correctness of SDK logic, request signing, and auth flows
            - Test coverage for changed behavior
            - Security implications, especially in wallet, keystore, signing, and session code
            - Adherence to code style (ktlint, KDoc on public APIs)
            - Any changes to the public API surface that should be reflected in docs/api.md or README.md
            Be concise. Flag blockers clearly; call out nits as nits.
