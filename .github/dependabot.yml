version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 14
    labels:
      - "dependencies"

  # No 14-day cooldown here: CI fails while this fixture is behind npm's latest Expo
  # major.minor, so its updates must arrive as soon as Expo releases them.
  - package-ecosystem: "npm"
    directory: "/compatibility-tests/expo"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      expo-stable:
        patterns:
          - "expo"
          - "react"
          - "react-native"

  # Mirrors the React Native SDK's supported-minimum fixture; check on the same weekly schedule.
  - package-ecosystem: "npm"
    directory: "/compatibility-tests/expo-min"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 1
    cooldown:
      default-days: 14
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "expo"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "react-native"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
    groups:
      expo-min-patch:
        patterns:
          - "expo"
          - "react"
          - "react-native"
